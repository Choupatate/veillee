{% extends "base.html" %}
{% block title %}{{ _("Not found") }} — {{ app_title }}{% endblock %}
{% block body_class %}page-not-found{% endblock %}
{% block content %}
<div class="empty-state">
  <img class="illo empty-state__illo" src="{{ theme_img('tumbleweed.jpg') }}"
       alt="" loading="lazy" decoding="async" width="900" height="488">
  <p>{{ _("That page doesn't exist, or it never did.") }}</p>
  <a class="btn btn--primary" href="{{ url_for('pages.timeline') }}">&lsaquo; {{ _("Back to the timeline") }}</a>
</div>
{% endblock %}
