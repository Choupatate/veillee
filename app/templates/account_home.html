{% extends "base.html" %}
{% block title %}{{ _("Account") }} — {{ app_title }}{% endblock %}
{% block body_class %}page-admin{% endblock %}
{% block content %}
<div class="admin">
  <p class="admin__back"><a href="{{ url_for('pages.timeline') }}">&lsaquo; {{ _("Timeline") }}</a></p>
  <h1 class="admin__title">{{ _("Account") }}</h1>
  <img class="illo illo--page" src="{{ url_for('static', filename='img/accounts-keys.jpg') }}"
       alt="" loading="lazy" decoding="async" width="760" height="540">
  <ul class="admin__list">
    <li class="admin__row">
      <a class="admin__row-name" href="{{ url_for('pages.account_password') }}">{{ _("Change password") }}</a>
    </li>
    <li class="admin__row">
      <a class="admin__row-name" href="{{ url_for('pages.account_write_links') }}">{{ _("Write links") }}</a>
    </li>
  </ul>
</div>
{% endblock %}
