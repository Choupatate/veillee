{% extends "base.html" %}
{% block title %}{{ heading }} — {{ app_title }}{% endblock %}
{% block body_class %}page-error{% endblock %}
{% block content %}
<div class="empty-state">
  <img class="illo empty-state__illo" src="{{ theme_img('tumbleweed.jpg') }}"
       alt="" loading="lazy" decoding="async" width="900" height="488">
  <h1 class="empty-state__heading">{{ heading }}</h1>
  <p>{{ message }}</p>
  {% if hint %}<p class="empty-state__hint">{{ hint }}</p>{% endif %}
  <a class="btn btn--primary" href="{{ url_for('pages.timeline') }}">&lsaquo; {{ _("Back to the timeline") }}</a>
</div>
{% endblock %}
